name: Dev Client

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  eas-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - run: bun install

      # Core has no nitrogen specs but the other packages import its types, so it must be
      # built before their codegen. Doing it here keeps it to one build per job: the
      # packages' own `build` deliberately no longer touches core's shared output.
      - name: Build core
        run: bun run build:core

      - run: bun run codegen
        working-directory: packages/react-native-healthkit

      - run: bun run codegen
        working-directory: packages/health-records

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: bun

      - name: Continuously Deploy
        uses: expo/expo-github-action/continuous-deploy-fingerprint@main
        with:
          auto-submit-builds: true
          platform: ios
          working-directory: ./apps/example
          profile: development-appstore-connect
          branch: ${{ github.ref_name }}
