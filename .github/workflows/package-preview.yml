name: Package Preview

on:
  pull_request:

permissions: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - run: bun install

      # Core has no nitrogen specs but the other packages import its types, so it must be
      # built before their codegen. Doing it here keeps it to one build per job: the
      # packages' own `build` deliberately no longer touches core's shared output.
      - name: Build core
        run: bun run build:core

      - run: bun run codegen
        working-directory: packages/react-native-healthkit

      - run: bun run codegen
        working-directory: packages/health-records

      - run: bunx pkg-pr-new publish './packages/*'
