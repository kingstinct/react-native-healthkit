# This is a basic workflow to help you get started with Actions

name: Test

on:
  workflow_call:
    inputs:
      bun-version:
        description: "Bun Version"
        required: false
        type: string
      os:
        description: "Operating System"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      bun-version:
        description: "Bun Version"
        required: false
        default: "latest"
        type: string
      os:
        description: "Operating System"
        required: false
        options:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
        default: "ubuntu-latest"
        type: choice

  pull_request:
  push:
    branches:
      - main
      - master

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      healthkit_contracts: ${{ steps.filter.outputs.healthkit_contracts }}
      swift_native: ${{ steps.filter.outputs.swift_native }}
    permissions:
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            healthkit_contracts:
              - '.bun-version'
              - 'bun.lock'
              - 'package.json'
              - 'packages/react-native-healthkit/src/**'
              - 'packages/react-native-healthkit/ios/**'
              - 'packages/react-native-healthkit/cpp/**'
              - 'packages/react-native-healthkit/scripts/**'
              - 'packages/react-native-healthkit/nitrogen/**'
              - 'packages/react-native-healthkit/app.plugin.*'
              - 'packages/react-native-healthkit/package.json'
              - 'packages/react-native-healthkit/tsconfig*.json'
              - 'packages/health-records/src/**'
              - 'packages/health-records/ios/**'
              - 'packages/health-records/nitrogen/**'
              - 'packages/health-records/app.plugin.*'
              - 'packages/health-records/package.json'
              - 'packages/health-records/tsconfig*.json'
              - 'apps/example/contracts/**'
              - 'apps/example/scripts/run-healthkit-contracts.sh'
              - 'apps/example/app.json'
              - 'apps/example/app/contracts.tsx'
              - 'apps/example/app/_layout.tsx'
              - 'apps/example/app/auth.tsx'
              - 'apps/example/constants/AllUsedIdentifiersInApp.ts'
              - 'apps/example/ios/**'
              - 'apps/example/package.json'
              - '.github/workflows/test.yml'
            swift_native:
              - 'packages/react-native-healthkit/ios/**'
              - 'packages/react-native-healthkit/cpp/**'
              - 'packages/health-records/ios/**'
              - 'apps/example/ios/**'
              - '.github/workflows/test.yml'

  test:
    # The type of runner that the job will run on
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 10

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - run: bun install

      - name: Test
        run: bun run test

  typecheck:
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 10

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - run: bun install --ignore-scripts --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  lint:
    # The type of runner that the job will run on
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 10

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - run: bun install --ignore-scripts --frozen-lockfile

      - name: Lint
        run: bun run lint

  swiftlint:
    needs: changes
    if: needs.changes.outputs.swift_native == 'true'
    # The type of runner that the job will run on
    runs-on: macos-15
    timeout-minutes: 10

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - run: bun install --ignore-scripts --frozen-lockfile

      - run: brew install swiftlint

      - name: Lint
        run: bun run swiftlint

  # Split out of build-ios: the generator reads whichever iOS SDK xcode-select points at and the
  # committed schema is generated from the newest one, so this always runs on the newest Xcode.
  # No simulator and no build here, so it costs a few minutes rather than the full build's time.
  verify-generated:
    needs: changes
    if: needs.changes.outputs.healthkit_contracts == 'true'
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile

      ## Resolved by glob rather than pinned: the xcode-27 image ships a single Xcode named after
      ## the exact release it carries (Xcode_27_beta_6.app, Xcode_27.0.app, ...), so a literal path
      ## rots every time the image is updated.
      - name: Select Xcode 27
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode 27 on this runner — the iOS 27 SDK is required." >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Verify generated HealthKit schema and bindings
        working-directory: packages/react-native-healthkit
        run: bun run check:generated

  # Builds the example app and runs the HealthKit contracts on every Xcode major we support:
  # the latest stable Xcode 26 on the macos-26 image, and Xcode 27 on GitHub's xcode-27 image
  # (one Xcode per image, updated in place as 27.x releases ship).
  build-ios-xcode:
    name: build-ios (Xcode ${{ matrix.xcode }})
    needs: changes
    if: needs.changes.outputs.healthkit_contracts == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          ## Xcode 26.6 (Swift 6.2) - latest stable
          - xcode: "26"
            runner: macos-26
            xcode-app: /Applications/Xcode_26.6.app
            ios: "26.5"
          ## Xcode 27 - the image ships exactly one, named after the release it carries, so it is
          ## resolved by glob (see verify-generated).
          - xcode: "27"
            runner: xcode-27
            xcode-app: /Applications/Xcode_27*.app
            ios: "27.0"

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          XCODE_APP="$(ls -d ${{ matrix.xcode-app }} 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode matching '${{ matrix.xcode-app }}' on this runner." >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install simulator tooling
        run: brew install wix/brew/applesimutils

      # The device set differs per Xcode (Xcode 26 ships iPhone 17 Pro, Xcode 27 ships iPhone 18
      # Pro), so pick the newest non-Max "iPhone N Pro" the runtime offers rather than a fixed name.
      - name: Select and boot simulator
        run: |
          DEVICE_LINE="$(
            xcrun simctl list devices available 'iOS ${{ matrix.ios }}' |
              grep -E '^[[:space:]]*iPhone [0-9]+ Pro \(' |
              sort -V |
              tail -n 1
          )"
          SIMULATOR_ID="$(printf '%s\n' "$DEVICE_LINE" | sed -n 's/^[[:space:]]*iPhone [0-9]* Pro (\([0-9A-F-][0-9A-F-]*\)) (.*/\1/p')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "Unable to find an available iPhone Pro simulator with iOS ${{ matrix.ios }}." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $DEVICE_LINE"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          # Kick off the boot now and let data migration run while we build.
          # The contract runner waits on `simctl bootstatus` before using it.
          xcrun simctl boot "$SIMULATOR_ID" || true

      - run: bun run codegen
        working-directory: packages/react-native-healthkit

      - run: bun run codegen
        working-directory: packages/health-records

      - name: Expo Prebuild
        working-directory: apps/example
        run: bunx expo prebuild --platform ios

      - name: Build iOS project
        working-directory: apps/example/ios
        run: |
          xcodebuild \
            -quiet \
            -workspace RNHealthKit.xcworkspace \
            -scheme RNHealthKit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIMULATOR_ID" \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            build

      - name: Run HealthKit contracts
        run: bun run test:contracts
        env:
          CONTRACT_DIAGNOSTICS_DIR: ${{ runner.temp }}/healthkit-contract-diagnostics

      - name: Upload contract diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: healthkit-contract-diagnostics-xcode-${{ matrix.xcode }}
          path: ${{ runner.temp }}/healthkit-contract-diagnostics
          if-no-files-found: ignore

  # Branch protection requires a check named `build-ios`. The matrix legs above report as
  # `build-ios (Xcode 26)` / `build-ios (Xcode 27)`, so this job carries the required name and
  # fails if any leg failed. A skipped matrix (no native changes) passes, as build-ios did before.
  build-ios:
    needs: [changes, build-ios-xcode]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check build-ios results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build-ios-xcode.result }}
        run: |
          echo "changes: $CHANGES_RESULT, build-ios matrix: $BUILD_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "The changes job did not succeed." >&2
            exit 1
          fi
          case "$BUILD_RESULT" in
            success|skipped) exit 0 ;;
            *)
              echo "At least one build-ios leg did not succeed." >&2
              exit 1
              ;;
          esac
